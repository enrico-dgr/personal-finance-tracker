name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The API refuses to start without a secret. The build and tests never
      # issue real tokens, so a throwaway value is enough here.
      AUTH_SECRET: ci-placeholder-secret-not-used-for-real-tokens
      DATABASE_URL: file:./dev.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
